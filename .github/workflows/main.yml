name: Build RSM Digital Media APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir -p project
          unzip -q RSM_Digital_Media_FINAL_SOURCE.zip -d project

      - name: Find Android project
        shell: bash
        run: |
          SETTINGS=$(find project -type f -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RSM-Digital-Media-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
